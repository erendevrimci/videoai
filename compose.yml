version: '3.8'

services:
  # 1. API Servisi (Web Sunucusu)
  # Bu servis dışarıdan gelen HTTP isteklerini karşılar.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./api:/app/api
      - ./tasks.py:/app/tasks.py
      - ./video_edit.py:/app/video_edit.py
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 2. Worker Servisi (Arka Plan İşçisi)
  # Bu servis Redis'i dinler ve uzun süren görevleri çalıştırır.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./api:/app/api
      - ./tasks.py:/app/tasks.py
      - ./video_edit.py:/app/video_edit.py
    depends_on:
      - redis
    restart: unless-stopped

  # 3. Redis Servisi (Mesaj Aracısı ve Sonuç Deposu)
  redis:
    image: "redis:alpine"
    restart: unless-stopped
    ports:
      - "6379:6379" # Yerel Redis istemcisiyle bağlanabilmek için
